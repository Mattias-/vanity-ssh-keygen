name: go

on:
  push:
    branches:
      - "master"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write # needed to write releases
  id-token: write # needed for keyless signing
  attestations: write # needed for provenance

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false

      - name: Debug GH
        env:
          REV_BEFORE: ${{ github.event.pull_request.base.sha || github.base_ref }}
          BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.base_ref || github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: env

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Generate Readme
        run: make check-readme

      - name: Smoke Test
        # Run smoke test to ensure the binary works as expected.
        timeout-minutes: 1
        run: make smoke-test

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: "v2.13.2"

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: success() && startsWith(github.ref, 'refs/tags/v')
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: success() && startsWith(github.ref, 'refs/tags/v')

      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        if: success() && startsWith(github.ref, 'refs/tags/v')
        with:
          version: "v2.18.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KO_DOCKER_REPO: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/vanity-ssh-keygen

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: success() && startsWith(github.ref, 'refs/tags/v')
        with:
          subject-checksums: ./dist/checksums.txt
